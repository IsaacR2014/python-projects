<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Alfred</title>
    <style>
        body {
    background-color: black;
    color: white;
    font-family: monospace;
    text-align: center;
}
button {
    background-color: #333;
    color: white;
    border: 2px solid white;
    padding: 10px 20px;
    font-size: 16px;
    margin: 10px;
    cursor: pointer;
}
button:hover {
    background-color: #555;
    border-color: yellow;
}
input {
    background-color: #333;
    color: white;
    border: 2px solid white;
    padding: 10px;
    font-size: 16px;
}
    </style>
</head>

<body>
    <h1>Alfred</h1>
    <button onclick="addHabit()">+ Add Habit</button>
    <div id="habits">
        <h2>Your Habits</h2>
    </div>

    <div id="checkin">
    </div>

    <div id="chat">
        <h2>Talk to Alfred</h2>
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button onclick="sendmessage()">Send</button>
        <button onclick="clearChat()">Clear Chat</button>
        <button onclick="deletememory()">Delete Chat</button>
        <div id="chatbox"></div>
    </div>
    <script>
    
    let habits = JSON.parse(localStorage.getItem("habits")) || [];

    function clearChat() {
    document.getElementById("chatbox").innerHTML = "";
}
document.getElementById("chatInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendmessage();
    }
});
function deletememory() {
    fetch('http://localhost:5000/clear', {
        method: 'POST'
    })
    .then(response => response.json())
    .then(data => {
        alert("Memory cleared!");
        document.getElementById("chatbox").innerHTML = "";
    });
}

function displayHabits() {
    let habitDiv = document.getElementById("habits");
    habitDiv.innerHTML = "<h2>Your Habits</h2>";
    for (let habit of habits) {
        habitDiv.innerHTML += `<p>${habit.name} - 🔥 ${habit.streak} day streak <button onclick="checkIn(${habits.indexOf(habit)})">Check In</button> <button onclick="deleteHabit(${habits.indexOf(habit)})">Delete</button> <button onclick="uncheck(${habits.indexOf(habit)})">uncheck</button></p>`;
    }
}
function checkIn(index) {
    let today = new Date().toISOString().split('T')[0];
    if (habits[index].last_checked === today) {
        alert("Already checked in today!");
    } else {
        habits[index].streak++;
        habits[index].last_checked = today;
        displayHabits();
    }
    localStorage.setItem("habits", JSON.stringify(habits));
}
function addHabit() {
    let name = prompt("What's the habit name?");
    if (!name) return;
    if (habits.length >= 12) {
    alert("Habit limit reached!")
    displayHabits();
    }
    else if (habits.find(h => h.name === name)) {
    alert("That habits taken!")
    }
    else if (name.length > 100) {
    alert("Name too long! Max 100 characters.");
}
    else{
    habits.push({name: name, streak: 0, last_checked:null})
    displayHabits();
    }
    localStorage.setItem("habits", JSON.stringify(habits));
}
function sendmessage() {
    let message = document.getElementById("chatInput").value;
    document.getElementById("chatbox").innerHTML += `<p>You: ${message}</p>`;
    document.getElementById("chatInput").value = "";
    fetch('http://localhost:5000/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: message, habits: habits})
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("chatbox").innerHTML += `<p>Alfred: ${data.reply}</p>`;
    });
}
function uncheck(index) {
    let bork = new Date().toISOString().split('T')[0];
    if (habits[index].last_checked === bork) {
       habits[index].streak--;
       habits[index].last_checked = null 
       displayHabits();
    } else {
        alert("You havent checked in today")
        displayHabits();
    }
    localStorage.setItem("habits", JSON.stringify(habits));
}
function deleteHabit(index) {
    habits.splice(index, 1);
    displayHabits()
    localStorage.setItem("habits", JSON.stringify(habits));
}
displayHabits();
</script>
</body>
</html>
